VW=W;VH=H;mode=m;cv.width=VW*2;cv.height=VH*2;c.imageSmoothingEnabled=false;c.scale(2,2);BG=grass(VW,VH);
document.body.classList.toggle("dk",m=="desktop");
$("dm").textContent=m=="desktop"?"SWITCH TO PHONE SCREEN":"SWITCH TO DESKTOP SCREEN";
$("sm").textContent="SCREEN: "+(m=="desktop"?"DESKTOP":"PHONE");
$("sh").textContent=m=="desktop"?"MOVE: W A S D OR ARROW KEYS, OR DRAG WITH THE MOUSE.":"MOVE: DRAG ON THE SCREEN.";
fit();try{localStorage.setItem("si1m",m)}catch(e){}}
function closeM(){menu=0;$("pn").classList.remove("on");$("sp").classList.remove("on")}
function loop(n){const dt=Math.min(.05,(n-lt)/1e3);lt=n;fr++;gt+=dt;if(gt>=10){gt-=10;drop()}
if(!menu&&!ovOn)step(dt);draw();if(menu)drawG(n/1e3);if(fr%6==0)hud();requestAnimationFrame(loop)}
$("mb").onclick=()=>{menu=1;ui();$("sp").classList.remove("on");$("pn").classList.add("on")};$("cl").onclick=closeM;$("sc").onclick=closeM;
$("sg").onclick=()=>{menu=1;$("pn").classList.remove("on");$("sp").classList.add("on")};$("dm").onclick=()=>setMode(mode=="desktop"?"phone":"desktop");
$("lk").onclick=()=>{const k=cost();if(S.coins>=k){S.coins-=k;S.luck++;sv();ui()}};
$("ca").onclick=()=>{gi.forEach(s=>S.stars[s.t]++);gi=[];S.garden=[];calc();sv();ui()};
$("sl").onclick=e=>{const b=e.target.closest(".up");if(!b||b.disabled)return;const t=+b.dataset.t,k=upc(t);if(S.up[t]<10&&S.coins>=k&&S.stars[t]>0){S.coins-=k;S.up[t]++;calc();sv();ui()}};
gd.onpointerdown=e=>{const r=gd.getBoundingClientRect(),px=(e.clientX-r.left)*120/r.width,py=(e.clientY-r.top)*80/r.height,n=gi.findIndex(s=>Math.abs(px-s.x-8)<9&&Math.abs(py-s.y-8)<9);if(n>=0){S.stars[gi[n].t]++;gi.splice(n,1);S.garden.splice(n,1);calc();sv();ui()}};
cv.onpointerdown=e=>{if(menu){closeM();return}cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect();joy={x:e.clientX,y:e.clientY,lx:(e.clientX-r.left)*VW/r.width,ly:(e.clientY-r.top)*VH/r.height}};
cv.onpointermove=e=>{if(!joy)return;const dx=e.clientX-joy.x,dy=e.clientY-joy.y,l=Math.hypot(dx,dy),m=Math.min(1,l/40);jx=l>6?dx/l*m:0;jy=l>6?dy/l*m:0};
cv.onpointerup=cv.onpointercancel=()=>{joy=null;jx=jy=0};
